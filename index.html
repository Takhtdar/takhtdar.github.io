<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="stylesheet" href="resc/css/main.css" />
  <title>Takhtdar Personal Websites</title>
  <link rel="icon" href="" />
  <script type="module" src="/resc/js/App.js" defer></script>
  <script src="/resc/js/UI.js"></script>
  <script src="/resc/js/showdown.min.js"></script>
</head>

<body>
  <section id="Header">
    <!-- Information about the author of website! -->
    <div id="introduction">
      <div>
        <p>
          <span id="welcomeMessage">Welcome to Personal Website of </span>
          <span id="name">Seyed Ahmad Takhtdar</span>
        </p>
        <h2 id="title">Amateur Software Engineer</h2>
        <p>Currently working at Takhtdar’s Corner</p>

        <div id="Icons" onmouseleave="clearTooltip()">
          <img onmouseover="describe('Python: Web2, Windows, SysAdmin Automation')" id="iconPython"
            src="resc/assets/img/python.png" alt="Python Programming Langauge Icon" />
          <img onmouseover="describe('Exploring The Core of Windows Internals')" id="iconWindows"
            src="resc/assets/img/computer.png" alt="Microsoft Windwos Internals Icon" />
          <img onmouseover="describe('C++ Newbie, Cross Platform Programming')" id="iconCPP"
            src="resc/assets/img/cpp.png" alt="CPP Programming Langauge Icon" />
          <img onmouseover="describe('C: Low-level Programming Foundation')" id="IconC" src="resc/assets/img/C.png"
            alt="C Programming Langauge Icon" />
          <img onmouseover="describe('Assembly: x86, x86_64 Reverse Engineering')" id="IconAssembly"
            src="resc/assets/img/assembly.png" alt="Assembly x86_64 Langauge Icon" />
          <div id="tooltip"></div>
        </div>

        <button class="shadow" onclick="rscrollToSection('Blog')">
          Blog ↓
        </button>
      </div>

      <!-- Update the photo -->

      <img src="resc/assets/img/Rectangle.svg" class="" id="HIcon" alt="Seyed Ahmad Takhtdar" />
    </div>
  </section>

  <!-- Create Blog -->
  <section id="Blog">

    <div class="container">
      <div id="asideOpenButton" class="shadow">↳</div>

      <aside>
        <div class="shadow" id="tableOfContent">
        <!-- Wrap it in anchor tag -->
          <span onclick="rscrollToSection('Blog');">Blog</span>
          <ul></ul>
        </div>
        <button id="emailBox" class="shadow" data="0x536579656461686d61644074616b68746461722e6972">
          Get Email in Clipboard
        </button>
      </aside>
      <div id="summaryPostHolder">
        <article class="displaynone"></article>
      </div>
    </div>
  </section>


</body>

</html>
